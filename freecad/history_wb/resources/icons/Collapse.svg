<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Rounded square outline -->
  <rect
    x="4" y="4"
    width="56" height="56"
    rx="12" ry="12"
    fill="none"
    stroke="currentColor"
    stroke-width="4"
  />
  <!-- Minus sign -->
  <line
    x1="18" y1="32"
    x2="46" y2="32"
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
